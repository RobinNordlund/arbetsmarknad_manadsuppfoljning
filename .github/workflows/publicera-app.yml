# Publicerar webbappen i app/ till GitHub Pages.
# Körs bara när den startas manuellt (Actions > Publicera app > Run
# workflow), aldrig automatiskt vid push.
# Appen har inget byggsteg: filerna publiceras som de är.
# Används inte app/? Ta bort den här filen tillsammans med mappen.
#
# Kräver: publikt repo och Settings > Pages > Source: GitHub Actions

name: Publicera app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    # Körs inte i själva mallrepot, bara i projekt skapade från det
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: publicering
        uses: actions/deploy-pages@v5
