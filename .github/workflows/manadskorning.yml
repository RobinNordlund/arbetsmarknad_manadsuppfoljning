# Schemalagd månadskörning: uppdaterar appens data när SCB har
# publicerat en ny månad och publicerar sedan appen på GitHub Pages.
#
# Körs varje vardag kl. 09:00 UTC (10:00 svensk vintertid, 11:00
# sommartid), eftersom SCB kan publicera vilken vardag som helst. Kan
# också startas för hand: Actions > Månadskörning > Run workflow.
#
# 1. Kontrollerar med R/02_ny_manad.R om alla tre SCB-tabellerna har
#    en nyare månad än app/data/meta.json. Annars slutar körningen här,
#    utan att något ändras.
# 2. Hämtar hela serien, bearbetar, validerar och exporterar JSON
#    (R/01, R/10 och R/99, som alltid kör R/98_validera.R först).
#    Stoppar valideringen publiceras inget och den tidigare versionen
#    ligger kvar.
# 3. Committar bara app/data/*.json till main. Har något annat ändrats
#    stoppar körningen i stället, så appens kod ändras aldrig här.
# 4. Publicerar appen på samma sätt som publicera-app.yml.
#
# Varje körning aktiverar också sitt eget workflow via GitHubs API, så
# att schemat inte stängs av efter 60 dagar utan aktivitet.
#
# Kräver: Settings > Actions > General > Workflow permissions som
# tillåter skrivning, och att main tar emot push från GitHub Actions.

name: Månadskörning

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

# Två körningar får aldrig uppdatera data samtidigt
concurrency:
  group: manadskorning
  cancel-in-progress: false

jobs:
  uppdatera:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # committa app/data/*.json
      actions: write    # aktivera workflowet (skydd mot 60 dagar)
    outputs:
      ny_manad: ${{ steps.kontroll.outputs.ny_manad }}
      publicera: ${{ steps.commit.outputs.publicera }}
    steps:
      - name: Håll schemat aktivt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/manadskorning.yml/enable" \
            || echo "::warning::Kunde inte aktivera workflowet via API:t"

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::here
            any::pxweb
            any::jsonlite

      - name: Finns en ny månad hos SCB?
        id: kontroll
        run: Rscript R/02_ny_manad.R

      - name: Hämta data från SCB
        if: steps.kontroll.outputs.ny_manad == 'true'
        run: Rscript R/01_hamta_data.R

      - name: Bearbeta
        if: steps.kontroll.outputs.ny_manad == 'true'
        run: Rscript R/10_bearbeta.R

      - name: Validera och exportera JSON
        if: steps.kontroll.outputs.ny_manad == 'true'
        run: Rscript R/99_exportera_json.R

      - name: Committa bara app/data/*.json
        id: commit
        if: steps.kontroll.outputs.ny_manad == 'true'
        env:
          MANAD: ${{ steps.kontroll.outputs.manad }}
        run: |
          # Andra ändrade filer än JSON i app/data/ stoppar körningen
          andra=$(git status --porcelain | grep -vE '^ ?[MA?]{1,2} app/data/[^/]+\.json$' || true)
          if [ -n "$andra" ]; then
            echo "::error::Körningen ändrade andra filer än app/data/*.json:"
            echo "$andra"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add app/data/*.json
          if git diff --cached --quiet; then
            echo "Inga ändringar i data att committa"
            echo "publicera=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Uppdatera data till $MANAD"
          git push origin HEAD:main
          echo "publicera=true" >> "$GITHUB_OUTPUT"

  publicera:
    needs: uppdatera
    if: ${{ needs.uppdatera.outputs.publicera == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      # main efter datacommiten
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: publicering
        uses: actions/deploy-pages@v5
